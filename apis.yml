description: 'BLAST is a Danish esports and gaming entertainment company headquartered in Copenhagen,
  founded in 2016. It produces and operates premier competitive gaming tournaments and leagues
  (notably Counter-Strike BLAST Premier) and runs the blast.tv streaming and fan-engagement
  platform, delivering live events, broadcasts, and interactive esports content to a global
  audience. Backed by Creandum, Heartcore, Maki.vc, and Vaekstfonden, BLAST was added to the
  API Evangelist network as a portfolio-lead company. No public developer API, portal, or
  documentation surface was found during enrichment; this profile captures verifiable identity
  and domain-security posture only.'
